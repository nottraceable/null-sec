[package]
name = "null_sec_lib"
version = "0.1.0"
description = "Zero-Server P2P Mesh Encrypted Terminal Communicator"
authors = ["NullSec Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.1"
tauri-plugin-fs = "2.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }

# Cryptography & Identity Engine
bip39 = { version = "2.1.0", features = ["rand"] }
rand = "0.8"
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["arrayref"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Peer-to-Peer & Network Engine
libp2p = { version = "0.54", features = [
  "tokio", "gossipsub", "kad", "noise", "yamux", "tcp", "quic", "dns", "ping", "identify", "relay", "dcutr", "mdns"
] }
futures = "0.3"

# Persistence Engine
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
name = "null_sec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
